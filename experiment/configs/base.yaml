# Base configuration for Q2Q motivation experiments

llm:
  provider: "openai"
  model: "gpt-5.1"
  temperature: 0.2
  max_tokens: 20000
  api_key: "sk-8b9a92f7a5cd4038a189d3708c5f865e"        # loaded from env OPENAI_API_KEY
  base_url: "https://matrixllm.alipay.com/v1"       # loaded from env OPENAI_BASE_URL

embedding:
  provider: "local"  # "local" or "api"
  model_name: "/Users/cyan/WYH/models/bge-large-en-v1.5"     # loaded from env DEFAULT_EMBEDDING_MODEL
  device: "cpu"
  dimension: 1024
  max_seq_length: 512
  batch_size: 32

generation:
  num_fake_queries: 10
  num_paraphrases: 5
  language: "en"
  output_dir: "experiment/generation/outputs"
  max_concurrent: 5
  save_interval: 10   # save every N items

store:
  backend: "numpy"    # numpy .npy file-based storage (no extra deps)
  base_dir: "experiment/store"

experiment:
  seed: 42
  results_dir: "experiment/results"
  log_level: "INFO"
